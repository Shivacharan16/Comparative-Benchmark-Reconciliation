[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ingestion-strategy-comparison"
version = "1.0.0"
description = "A Production-grade Data Engineering benchmark comparing Full Refresh, Incremental Merge, and Partition Replacement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
